name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Force bundled Node 20 actions (e.g. github-script inside
# codecov-action@v5) onto Node 24 ahead of GitHub's 2026-06-16 cutover.
# Belt-and-suspenders to the orion runner's /home/runner/.env (spore-host#345);
# this also covers GitHub-hosted fallback runs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      # Formatting gate (#99). Runs first because it's the cheapest check and the
      # fastest to act on. Nothing gated formatting before: CI had no formatting
      # step, and `make fmt` rewrites files and always succeeds, so it could only
      # ever report success. The tree happened to be clean when this landed — the
      # gate is what keeps it that way, which is the lesson from the siblings
      # (spawn#484 had 3 files drifted, truffle#122 had 7).
      #
      # gofmt walks paths rather than modules, so this also covers
      # lambda/capacity-poller, which the per-module step below does not format.
      - name: Format gate
        run: make check-fmt

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -short -coverprofile=coverage.out ./...

      - name: Coverage gate
        env:
          # Ratchet floor — must not drop below this. Raise it as coverage
          # improves; target is 60% (see CLAUDE.md). Current: ~42.2%.
          MIN_COVERAGE: '40'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (floor: ${MIN_COVERAGE}%)"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t+0 >= m+0) }' \
            || { echo "::error::coverage ${total}% is below floor ${MIN_COVERAGE}%"; exit 1; }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Vet
        run: go vet ./...

      # Docs drift gate: the committed command/flag reference (docs-gen/) is
      # generated from the CLI via `gen-docs`. Regenerate and fail if it's stale,
      # so a flag/command change can't merge without its reference update.
      - name: Docs reference drift gate
        run: make check-docs

      # The capacity-poller Lambda is a separate Go module (own go.mod with a
      # replace → root), so `go build ./...` above doesn't cover it. Build/vet/
      # test it explicitly so changes to the shared poller wiring (e.g. the
      # hosted-poller options) are guarded in CI, not just locally.
      - name: Build + test lambda module
        working-directory: lambda/capacity-poller
        run: |
          go build ./...
          go vet ./...
          go test -short ./...
